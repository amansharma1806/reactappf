spring.application.name=user-form-backend

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/user_form_db}
spring.datasource.username=${DB_USERNAME:root}
# DO NOT store secrets in source files. Use an environment variable or secret manager.
# Set `DB_PASSWORD` in the environment or CI secrets; example: PowerShell: $env:DB_PASSWORD = 'your_secret'
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configurationsetx DB_PASSWORD "NAYA_PASSWORD"
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8080}

# CORS Configuration
spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allow-credentials=true
